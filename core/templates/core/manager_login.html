{% extends 'base.html' %}

{% block title %}Manager Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-5">
            <div class="card-header bg-primary text-white">
                <h4>Manager Access Required</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        {{ form.code.label_tag }}
                        {{ form.code }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg">Unlock</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
